<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>wavelab — каталог музыки</title>
<meta name="theme-color" content="#0d0d11">
<style>
:root{
  --bg:#0d0d11; --panel:#121217; --hover:#18181f; --line:#23232c;
  --text:#ececf1; --mut:#8b8b99; --acc:#c6ff3d; --on:#11160a; --danger:#ff6b6b;
  --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.f{fill:currentColor;stroke:none}
.num{font-variant-numeric:tabular-nums}

/* боковое меню */
.side{width:232px;flex:none;border-right:1px solid var(--line);padding:22px 12px 100px;overflow-y:auto;background:var(--bg)}
.logo{display:flex;align-items:center;gap:9px;padding:0 10px 22px;font-size:18px;font-weight:700;letter-spacing:-.02em}
.logo i{width:12px;height:12px;background:var(--acc);border-radius:3px}
.nav-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:18px 10px 6px}
.nv{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border-radius:var(--r);color:var(--mut);font-weight:500;text-align:left;transition:background .15s,color .15s}
.nv:hover{background:var(--hover);color:var(--text)}
.nv.on{background:var(--hover);color:var(--text)}
.nv.on .i{color:var(--acc)}
.nv .c{margin-left:auto;font-size:12px;color:var(--mut)}

/* контент */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:16px 28px;border-bottom:1px solid var(--line)}
.search{flex:1;max-width:420px;position:relative}
.search .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px 10px 38px;outline:0}
.search input:focus{border-color:var(--acc)}
.search input::placeholder{color:var(--mut)}
select{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;outline:0;cursor:pointer}
select:focus{border-color:var(--acc)}
.scroll{flex:1;overflow-y:auto;padding:26px 28px 120px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.head h1{font-size:28px;letter-spacing:-.03em;line-height:1.1}
.head p{color:var(--mut);margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:99px;font-weight:600;background:var(--acc);color:var(--on);transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--hover);filter:none}

/* таблица треков */
.cols,.row{display:grid;grid-template-columns:40px minmax(0,1fr) 150px 120px 56px 112px;align-items:center;gap:12px;padding:0 12px}
.cols{height:34px;color:var(--mut);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--line);margin-bottom:6px}
.row{min-height:58px;border-radius:var(--r);cursor:pointer;transition:background .12s}
.row:hover{background:var(--hover)}
.row.cur{background:var(--hover)}
.row.cur .tt{color:var(--acc)}
.idx{position:relative;text-align:center;color:var(--mut);height:20px;line-height:20px}
.idx .pl{display:none;position:absolute;inset:0;place-items:center;color:var(--text)}
.row:hover .idx .n{display:none}.row:hover .idx .pl{display:grid}
.row.cur .idx .n{display:none}.row.cur .idx .pl{display:grid;color:var(--acc)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who div{min-width:0}
.tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gn,.ql,.tm{color:var(--mut);font-size:13px}
.ql b{font-weight:600;color:var(--text)}
.ql.lossless b{color:var(--acc)}
.tm{text-align:right}
.acts{display:flex;justify-content:flex-end;gap:2px}
.ab{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--mut);opacity:0;transition:.15s}
.row:hover .ab,.row.cur .ab,.ab.on{opacity:1}
.ab:hover{background:var(--line);color:var(--text)}
.ab.on{color:var(--acc)}
.ab.fv.on .i{fill:var(--acc)}
@media(hover:none){.ab{opacity:1}}
.empty{padding:60px 0;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:4px}

/* обложки: плоские, без градиентов */
.cv{position:relative;display:block;width:40px;height:40px;border-radius:6px;overflow:hidden;background:var(--bg0);flex:none}
.cv::before,.cv::after{content:"";position:absolute}
.cv[data-s="1"]::before{width:70%;height:70%;border-radius:50%;background:var(--fg0);left:15%;top:15%}
.cv[data-s="2"]::before{width:60%;height:60%;background:var(--fg0);left:20%;top:20%;transform:rotate(18deg)}
.cv[data-s="3"]::before{width:100%;height:50%;background:var(--fg0);left:0;bottom:0;border-radius:100% 100% 0 0}
.cv[data-s="4"]::before{inset:0;background:var(--fg0);clip-path:polygon(50% 18%,88% 82%,12% 82%)}
.cv[data-s="5"]::before{inset:0;background:repeating-linear-gradient(90deg,var(--fg0) 0 18%,transparent 18% 36%)}
.cv.lg{width:56px;height:56px;border-radius:8px}

/* плеер */
.player{position:fixed;left:0;right:0;bottom:0;height:84px;z-index:30;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,560px) minmax(0,1fr);align-items:center;gap:20px;padding:0 24px;background:var(--panel);border-top:1px solid var(--line)}
.p-left{display:flex;align-items:center;gap:12px;min-width:0}
.p-left .t{min-width:0}
.p-center{display:flex;flex-direction:column;gap:6px}
.ctrls{display:flex;align-items:center;justify-content:center;gap:6px}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--mut);transition:.15s}
.ib:hover{color:var(--text)}
.ib.on{color:var(--acc)}
.ib.play{width:42px;height:42px;background:var(--text);color:var(--bg)}
.ib.play:hover{transform:scale(1.06);color:var(--bg)}
.seekrow{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12px}
.seekrow span{width:36px;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:4px;border-radius:4px;outline:0;cursor:pointer;background:linear-gradient(to right,var(--text) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]:hover{background:linear-gradient(to right,var(--acc) var(--p,0%),var(--line) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--text);opacity:0;transition:.15s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{opacity:1}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--text)}
.p-right{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.vol{display:flex;align-items:center;gap:6px;width:130px;color:var(--mut)}
.dl{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;background:var(--acc);color:var(--on);font-weight:600;white-space:nowrap}
.dl:hover{filter:brightness(1.08)}
.dl.off{opacity:.4;pointer-events:none}

.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,10px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* телефон и планшет */
.chips{display:none}
@media(max-width:860px){
  body{flex-direction:column;overflow:hidden}
  .side{width:100%;border-right:0;border-bottom:1px solid var(--line);padding:12px 12px 8px;overflow:visible}
  .logo{padding:0 4px 10px}
  .nav-h,.side .genres{display:none}
  .navrow{display:flex;gap:6px}
  .nv{width:auto;flex:1;justify-content:center;padding:9px 6px;font-size:13px}
  .nv .c{margin-left:4px}
  .nv .i{display:none}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:6px 13px;border-radius:99px;border:1px solid var(--line);color:var(--mut);font-weight:500;font-size:13px}
  .chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
  .top{padding:12px 14px}
  .scroll{padding:18px 14px 150px}
  .head h1{font-size:23px}
  .cols{display:none}
  .row{grid-template-columns:44px minmax(0,1fr) auto;padding:0 6px;gap:10px}
  .gn,.ql,.tm,.ab.dlb{display:none}
  .ab{opacity:1;width:38px;height:38px}
  .idx{display:none}
  .row .who{grid-column:1/3}
  .player{height:auto;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  .p-center{display:contents}
  .ctrls{grid-column:2;grid-row:1}
  .seekrow{grid-column:1/-1;grid-row:2}
  .p-right{grid-column:3;grid-row:1}
  .hm,.vol,.dl span{display:none}
  .dl{padding:10px;border-radius:50%}
  .ib.play{width:44px;height:44px}
  .toast{bottom:130px}
}
@media(max-width:860px) and (min-width:600px){.top{padding:12px 24px}.scroll{padding-left:24px;padding-right:24px}}

/* ===== экран «Сейчас играет» ===== */
.p-left{cursor:pointer}
.cv.im{background-size:cover;background-position:center}
.cv.im::before,.cv.im::after{display:none}
.cv.xl{width:min(80vw,42vh,400px);height:min(80vw,42vh,400px);border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.55);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.np{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transform:translateY(100%);visibility:hidden;transition:transform .38s cubic-bezier(.2,.8,.2,1),visibility 0s .38s}
.np.on{transform:none;visibility:visible;transition-delay:0s}
.np-bg{position:fixed;inset:-60px;background-size:cover;background-position:center;filter:blur(60px) saturate(1.3);opacity:.45;pointer-events:none;transition:background-color .5s}
.np-in{position:relative;max-width:460px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 22px calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.np-top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.np-top .ib{width:44px;height:44px;color:var(--text)}
.np-from{text-align:center;min-width:0}
.np-from small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.np-from b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-art{display:grid;place-items:center;padding:6px 0}
.np:not(.playing) .np-art .cv{transform:scale(.88)}
.np-meta{display:flex;align-items:center;gap:12px}
.np-meta>div{flex:1;min-width:0}
.np-t{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere}
.np-a{color:var(--mut);margin-top:2px}
.np-meta .ib{width:44px;height:44px;color:var(--text)}
.np-meta .ib.on{color:var(--acc)}.np-meta .ib.on .i{fill:var(--acc)}
.np input[type=range]{height:6px}
.np input[type=range]::-webkit-slider-thumb{opacity:1;width:14px;height:14px}
.np .ctrls{justify-content:space-between;gap:6px}
.np .ib .i{width:22px;height:22px}
.np .ib.play{width:72px;height:72px}
.np .ib.play .i{width:30px;height:30px}
.np-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:13px;font-weight:500;white-space:nowrap;color:var(--text)}
.pill .i{width:16px;height:16px}
.pill.on{border-color:var(--acc);color:var(--acc)}
.np-up h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:10px 0 6px}
.up{display:flex;align-items:center;gap:12px;padding:8px;border-radius:var(--r);cursor:pointer}
@media(hover:hover){.up:hover{background:var(--hover)}}
.up>div{min-width:0;flex:1}
.up .qb{font-size:11px;color:var(--acc);flex:none}
.np-empty{color:var(--mut);padding:10px 8px}
@media(min-width:861px){.np-in{padding-top:28px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></symbol>
<symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.3l8.8-8.9a5.5 5.5 0 0 0 0-7.8Z"/></symbol>
<symbol id="i-lib" viewBox="0 0 24 24"><path d="M4 4v16M9 4v16M14 6l5 14M14 6l-1 .3"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-shuf" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
<symbol id="i-rep" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></symbol>
<symbol id="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9zM16 8.5a5 5 0 0 1 0 7"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
<symbol id="i-speed" viewBox="0 0 24 24"><path d="m12 14 4-4M3.3 17a10 10 0 1 1 17.4 0"/></symbol>
<symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></symbol>
</svg>

<aside class="side">
  <div class="logo"><i></i>wavelab</div>
  <div class="navrow">
    <button class="nv on" data-view="all" type="button"><svg class="i"><use href="#i-lib"/></svg>Каталог<span class="c" id="cAll"></span></button>
    <button class="nv" data-view="fav" type="button"><svg class="i"><use href="#i-heart"/></svg>Избранное<span class="c" id="cFav"></span></button>
    <button class="nv" data-view="queue" type="button"><svg class="i"><use href="#i-list"/></svg>Очередь<span class="c" id="cQ"></span></button>
  </div>
  <div class="genres"><div class="nav-h">Жанры</div><div id="genreNav"></div></div>
</aside>

<div class="main">
  <div class="top">
    <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Поиск по трекам и артистам" autocomplete="off" aria-label="Поиск"></label>
    <select id="sort" aria-label="Сортировка">
      <option value="def">По умолчанию</option><option value="pop">Популярные</option><option value="az">По названию</option><option value="art">По артисту</option>
    </select>
  </div>
  <div class="scroll" id="scroll">
    <div class="chips" id="chips"></div>
    <div class="head">
      <div><h1 id="title">Каталог</h1><p id="sub"></p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="playAll" type="button"><svg class="i f"><use href="#i-play"/></svg>Слушать всё</button><button class="btn ghost" id="shufAll" type="button"><svg class="i"><use href="#i-shuf"/></svg>Вперемешку</button></div>
    </div>
    <div class="cols"><span style="text-align:center">#</span><span>Название</span><span>Жанр</span><span>Качество</span><span style="text-align:right">Время</span><span></span></div>
    <div id="list"></div>
  </div>
</div>

<div class="player" id="player">
  <div class="p-left">
    <span class="cv lg" id="pCv" style="--bg0:#23232c;--fg0:#3a3a46" data-s="1"></span>
    <div class="t"><div class="tt" id="pT">Ничего не играет</div><div class="ar" id="pA">Выберите трек из списка</div></div>
  </div>
  <div class="p-center">
    <div class="ctrls">
      <button class="ib hm" id="bShuf" type="button" aria-label="Вперемешку"><svg class="i"><use href="#i-shuf"/></svg></button>
      <button class="ib" id="bPrev" type="button" aria-label="Предыдущий"><svg class="i f"><use href="#i-prev"/></svg></button>
      <button class="ib play" id="bPlay" type="button" aria-label="Играть / пауза"><svg class="i f" id="bPlayI"><use href="#i-play"/></svg></button>
      <button class="ib" id="bNext" type="button" aria-label="Следующий"><svg class="i f"><use href="#i-next"/></svg></button>
      <button class="ib hm" id="bRep" type="button" aria-label="Повтор"><svg class="i"><use href="#i-rep"/></svg></button>
    </div>
    <div class="seekrow num"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="100" step="0.1" value="0" aria-label="Перемотка"><span id="dur">0:00</span></div>
  </div>
  <div class="p-right">
    <div class="vol"><svg class="i"><use href="#i-vol"/></svg><input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Громкость"></div>
    <button class="dl off" id="dl" type="button"><svg class="i"><use href="#i-dl"/></svg><span>Скачать в отличном качестве</span></button>
  </div>
</div>

<div class="np" id="np" aria-hidden="true" role="dialog" aria-label="Сейчас играет">
  <div class="np-bg" id="npBg"></div>
  <div class="np-in">
    <div class="np-top">
      <button class="ib" id="npClose" type="button" aria-label="Свернуть"><svg class="i"><use href="#i-down"/></svg></button>
      <div class="np-from"><small>Сейчас играет</small><b id="npFrom"></b></div>
      <span></span>
    </div>
    <div class="np-art"><span class="cv xl" id="npCv" data-s="1"></span></div>
    <div class="np-meta">
      <div><div class="np-t" id="npT"></div><div class="np-a" id="npA"></div></div>
      <button class="ib" id="npFav" type="button" aria-label="В избранное"><svg class="i"><use href="#i-heart"/></svg></button>
    </div>
    <div class="seekrow num"><span id="npCur">0:00</span><input type="range" id="npSeek" min="0" max="100" step="0.1" value="0" aria-label="Перемотка"><span id="npDur">0:00</span></div>
    <div class="ctrls">
      <button class="ib" id="npShuf" type="button" aria-label="Вперемешку"><svg class="i"><use href="#i-shuf"/></svg></button>

var BPMS=[100,118,84,124,96,126,88,108,122,92,78,112];
var DURS=BPMS.map(function(b){return 16*4*60/b});
var GEN={};
function genUrl(id){
  if(GEN[id])return GEN[id];
  var sr=22050,BPM=BPMS[id%12],beat=60/BPM,bars=16;
  var N=Math.floor(sr*bars*4*beat),buf=new Float32Array(N);
  var root=[45,47,40,43,50,52,38,45,48,41,43,46][id%12];
  var chords=[[0,3,7],[-4,0,3],[3,7,10],[-2,2,5]],offs=[0,-4,3,-2];
  var seed=id*9301+49297;function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
  var house=(id===3||id===5||id===11||id===1||id===8);

  function tone(st,len,f,amp,kind,dec){
    var s0=Math.floor(st*sr),n=Math.floor(len*sr),w=2*Math.PI*f/sr,ph=0;
    for(var i=0;i<n&&s0+i<N;i++){
      var t=i/sr,e;
      if(kind==='pad'){e=Math.sin(Math.PI*i/n);e*=e}else{e=Math.min(1,t*200)*Math.exp(-t*dec)}
      var v=Math.sin(ph);
      if(kind==='arp')v+=.35*Math.sin(ph*2)+.15*Math.sin(ph*3);
      if(kind==='pad')v=.6*v+.4*Math.sin(ph*1.003*2);
      buf[s0+i]+=v*e*amp;ph+=w;
    }
  }
  function kick(st){
    var s0=Math.floor(st*sr),n=Math.floor(.28*sr),ph=0;
    for(var i=0;i<n&&s0+i<N;i++){var t=i/sr,f=48+120*Math.exp(-t*28);ph+=2*Math.PI*f/sr;buf[s0+i]+=Math.sin(ph)*Math.exp(-t*8)*.55}
  }
  function hat(st,a){
    var s0=Math.floor(st*sr),n=Math.floor(.05*sr);

  }
  for(var b=0;b<bars;b++){
    var ci=b%4,base=root+offs[ci],t0=b*4*beat,ch=chords[ci];
    // пэд (аккорды)
    for(var k=0;k<3;k++)tone(t0,4*beat,mf(base+12+ch[k]),.045,'pad',0);
    // бас
    for(var s=0;s<8;s++){if(house||s%2===0)tone(t0+s*beat/2,beat/2*.95,mf(base-12+(s%4===3?ch[1]:0)),.22,'bass',5)}

  var pk=0;for(var i=0;i<N;i++){var v=Math.abs(buf[i]);if(v>pk)pk=v}

  var dv=new DataView(new ArrayBuffer(44+N*2));
  function ws(o,s){for(var j=0;j<s.length;j++)dv.setUint8(o+j,s.charCodeAt(j))}

  for(var m=0;m<N;m++){var x=Math.tanh(buf[m]*g*1.2)*32000;dv.setInt16(44+m*2,x,true)}
  GEN[id]=URL.createObjectURL(new Blob([dv],{type:'audio/wav'}));
  return GEN[id];
}

function playId(id,list,noplay){
  var t=TRACKS[id];if(!t)return;
  if(list)ORDER=list.slice();
  cur=id;audio.src=t.src||genUrl(id);audio.playbackRate=SPEEDS[spI];
  if(!noplay){var p=audio.play();if(p&&p.catch)p.catch(function(){toast('Нажмите Play ещё раз')})}
  $('pT').textContent=t.t;$('pA').textContent=t.a+' · '+t.q;
  setCv($('pCv'),t);
  $('dl').classList.remove('off');
  document.title=t.t+' — '+t.a;
  if('mediaSession' in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:t.t,artist:t.a,album:t.g,artwork:t.img?[{src:new URL(t.img,location.href).href}]:[]})}catch(e){}}

}
function toggle(){
  if(cur<0){var l=visible();if(l.length)playId(l[0].id,ORDER);return}

function step(dir,auto){
  if(!ORDER.length)ORDER=TRACKS.map(function(t){return t.id});
  if(dir>0&&queue.length&&view!=='queue'){var n=queue.shift();return playId(n)}
  var i=ORDER.indexOf(cur),n;
  if(shuffle&&ORDER.length>1){do{n=ORDER[Math.floor(Math.random()*ORDER.length)]}while(n===cur)}
  else{i+=dir;if(i>=ORDER.length){if(auto&&rep===0){audio.pause();return}i=0}if(i<0)i=ORDER.length-1;n=ORDER[i]}
  playId(n);
}

  fetch(u).then(function(r){return r.blob()}).then(function(b){
    var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(t.a+' - '+t.t).replace(/[\\/:*?"<>|]/g,'_')+ext;
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000);
  }).catch(function(){window.open(u,'_blank')});
}
$('list').addEventListener('click',function(e){
  var r=e.target.closest('.row');if(!r)return;
  var id=+r.dataset.id,b=e.target.closest('[data-a]'),a=b?b.dataset.a:'';
  if(a==='fav')return toggleFav(id);
  if(a==='q'){queue.push(id);toast('Добавлено в очередь: '+TRACKS[id].t);return renderNav()}
  if(a==='unq'){queue.splice(+r.dataset.n,1);return render()}
  if(a==='dl')return download(id);
  if(view==='queue'){queue.splice(+r.dataset.n,1);renderNav();return playId(id)}
  if(id===cur){if(e.target.closest('.idx'))toggle();else openNp();return}
  playId(id,ORDER);
});
document.addEventListener('click',function(e){
  var n=e.target.closest('.nv,.chip');if(!n)return;
  if(n.dataset.view){view=n.dataset.view;genre=''}
  else if(n.dataset.g!==undefined){view='all';genre=n.dataset.g}
  $('scroll').scrollTop=0;render();
});
$('q').oninput=function(e){query=e.target.value.trim().toLowerCase();render()};
$('sort').onchange=function(e){sortV=e.target.value;render()};
$('playAll').onclick=function(){if(ORDER.length){shuffle=false;$('bShuf').classList.remove('on');playId(ORDER[0],ORDER)}};
$('shufAll').onclick=function(){if(ORDER.length){shuffle=true;$('bShuf').classList.add('on');playId(ORDER[Math.floor(Math.random()*ORDER.length)],ORDER)}};
$('bPlay').onclick=toggle;
$('bNext').onclick=function(){step(1)};
$('bPrev').onclick=function(){if(audio.currentTime>3)audio.currentTime=0;else step(-1)};
function toggleShuf(){shuffle=!shuffle;toast(shuffle?'Вперемешку: вкл':'Вперемешку: выкл');paintModes();syncNp()}
$('bShuf').onclick=$('npShuf').onclick=toggleShuf;
function cycleRep(){rep=(rep+1)%3;toast(['Повтор выключен','Повтор списка','Повтор трека'][rep]);paintModes()}
$('bRep').onclick=$('npRep').onclick=cycleRep;
$('seek').oninput=$('npSeek').oninput=function(e){if(audio.duration)audio.currentTime=e.target.value/100*audio.duration;fill(e.target)};
$('vol').oninput=function(e){audio.volume=+e.target.value;fill(e.target);save('wl3_vol',+e.target.value)};
$('dl').onclick=function(){if(cur>-1)download(cur)};
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&npOn){closeNp();return}
  var tg=e.target.tagName;if(tg==='INPUT'&&e.target.type!=='range'||tg==='SELECT')return;
  if(e.code==='Space'){e.preventDefault();toggle()}
  else if(e.code==='ArrowRight'&&audio.duration){audio.currentTime=Math.min(audio.duration,audio.currentTime+10)}
  else if(e.code==='ArrowLeft'){audio.currentTime=Math.max(0,audio.currentTime-10)}
  else if(e.key==='n'||e.key==='N')step(1);
  else if(e.key==='p'||e.key==='P')step(-1);
  else if((e.key==='f'||e.key==='F')&&cur>-1)toggleFav(cur);
});


/* ===== экран «Сейчас играет» ===== */
var npOn=false,SPEEDS=[1,1.25,1.5,2,0.75],spI=0,sleepEnd=0,sleepInt=0,sleepI=0,SLEEP=[0,15,30,60];
function paintModes(){
  ['bShuf','npShuf'].forEach(function(i){$(i).classList.toggle('on',shuffle)});
  ['bRep','npRep'].forEach(function(i){$(i).classList.toggle('on',rep>0)});
}
function syncNp(){
  var t=TRACKS[cur];if(!t)return;
  setCv($('npCv'),t);
  var bg=$('npBg');bg.style.backgroundImage=t.img?"url('"+t.img+"')":'none';bg.style.backgroundColor=t.img?'transparent':t.c[0];
  $('npT').textContent=t.t;$('npA').textContent=t.a;$('npFrom').textContent=t.g;
  $('npFav').classList.toggle('on',favs.indexOf(t.key)>-1);
  $('np').classList.toggle('playing',!audio.paused);
  $('npPlayI').innerHTML='<use href="#i-'+(audio.paused?'play':'pause')+'"/>';
  var up=[],i,p=ORDER.indexOf(cur);
  queue.forEach(function(id,n){up.push({id:id,q:n})});
  if(!shuffle&&p>-1)for(i=p+1;i<ORDER.length&&up.length<12;i++)up.push({id:ORDER[i]});
  $('npUp').innerHTML=up.length?up.map(function(u){var x=TRACKS[u.id];if(!x)return '';
    return '<div class="up" data-id="'+u.id+'"'+(u.q!==undefined?' data-q="'+u.q+'"':'')+'>'+cv(x)+'<div><div class="tt">'+esc(x.t)+'</div><div class="ar">'+esc(x.a)+'</div></div>'+(u.q!==undefined?'<span class="qb">очередь</span>':'')+'</div>'}).join(''):'<div class="np-empty">Дальше ничего нет</div>';
}
function openNp(){
  if(cur<0||npOn)return;
  npOn=true;syncNp();$('np').classList.add('on');$('np').setAttribute('aria-hidden','false');$('np').scrollTop=0;
  try{history.pushState({np:1},'')}catch(e){}
}
function hideNp(){npOn=false;$('np').classList.remove('on');$('np').setAttribute('aria-hidden','true')}
function closeNp(){if(!npOn)return;if(history.state&&history.state.np)history.back();else hideNp()}
window.addEventListener('popstate',function(){if(npOn)hideNp()});
$('npClose').onclick=closeNp;
$('player').querySelector('.p-left').onclick=function(){if(cur>-1)openNp()};
$('npPlay').onclick=toggle;
$('npNext').onclick=function(){step(1)};
$('npPrev').onclick=function(){if(audio.currentTime>3)audio.currentTime=0;else step(-1)};
$('npFav').onclick=function(){if(cur>-1)toggleFav(cur)};
$('npDl').onclick=function(){if(cur>-1)download(cur)};
$('npUp').onclick=function(e){
  var r=e.target.closest('.up');if(!r)return;
  if(r.dataset.q!==undefined)queue.splice(+r.dataset.q,1);
  renderNav();playId(+r.dataset.id);
};
/* свайп вниз закрывает экран */
(function(){var y0=null;var n=$('np');
  n.addEventListener('touchstart',function(e){y0=n.scrollTop<=0?e.touches[0].clientY:null},{passive:true});
  n.addEventListener('touchend',function(e){if(y0!==null&&e.changedTouches[0].clientY-y0>110)closeNp();y0=null},{passive:true});
})();
/* поделиться */
$('npShare').onclick=function(){
  var t=TRACKS[cur];if(!t)return;
  var u=location.origin+location.pathname+'#t='+encodeURIComponent(t.key);
  if(navigator.share)navigator.share({title:t.t+' — '+t.a,url:u}).catch(function(){});
  else if(navigator.clipboard)navigator.clipboard.writeText(u).then(function(){toast('Ссылка скопирована')},function(){toast(u)});
  else toast(u);
};
/* таймер сна */
function sleepTick(){
  var left=sleepEnd-Date.now();
  if(left<=0){clearInterval(sleepInt);sleepEnd=0;sleepI=0;audio.pause();$('npSleepL').textContent='Таймер сна';$('npSleep').classList.remove('on');toast('Таймер сна: музыка остановлена');return}
  var m=Math.floor(left/60000),s=Math.floor(left%60000/1000);$('npSleepL').textContent='Сон через '+m+':'+('0'+s).slice(-2);
}
$('npSleep').onclick=function(){
  sleepI=(sleepI+1)%SLEEP.length;clearInterval(sleepInt);
  if(!SLEEP[sleepI]){sleepEnd=0;$('npSleepL').textContent='Таймер сна';this.classList.remove('on');return toast('Таймер сна выключен')}
  sleepEnd=Date.now()+SLEEP[sleepI]*60000;this.classList.add('on');sleepTick();sleepInt=setInterval(sleepTick,1000);
  toast('Остановим через '+SLEEP[sleepI]+' мин');
};
/* скорость */
$('npSpeed').onclick=function(){
  spI=(spI+1)%SPEEDS.length;audio.defaultPlaybackRate=audio.playbackRate=SPEEDS[spI];
  $('npSpeedL').textContent=SPEEDS[spI]+'×';this.classList.toggle('on',spI!==0);
};
/* кнопки на экране блокировки */
if('mediaSession' in navigator){try{
  navigator.mediaSession.setActionHandler('seekto',function(d){if(d.seekTime!=null)audio.currentTime=d.seekTime});
  navigator.mediaSession.setActionHandler('seekbackward',function(){audio.currentTime=Math.max(0,audio.currentTime-10)});
  navigator.mediaSession.setActionHandler('seekforward',function(){audio.currentTime=Math.min(audio.duration||0,audio.currentTime+10)});
}catch(e){}}
/* ссылка на трек: сайт/#t=... */
function openFromHash(){
  var m=location.hash.match(/^#t=(.+)$/);if(!m)return;
  var k;try{k=decodeURIComponent(m[1])}catch(e){return}
  var t=TRACKS.filter(function(x){return x.key===k})[0];
  if(t){playId(t.id,null,true);openNp();toast('Нажмите ▶, чтобы слушать')}
}

audio.volume=vol;$('vol').value=vol;fill($('vol'));fill($('seek'));
loadTracks(function(){render();openFromHash()});
})();
</script>
</body>
