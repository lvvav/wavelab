name: Deploy admin-album
# Запуск вручную: GitHub → Actions → Deploy admin-album → Run workflow.
# Перед этим в Settings → Secrets and variables → Actions добавьте секреты:
#   ADMIN_USER, ADMIN_PASS, ADMIN_WORD  (SUPABASE_ACCESS_TOKEN уже есть)
# ADMIN_SECRET добавлять не обязательно: если его нет, он считается из SUPABASE_ACCESS_TOKEN.
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Задать секреты функции
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
          ADMIN_WORD: ${{ secrets.ADMIN_WORD }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          for n in ADMIN_USER ADMIN_PASS ADMIN_WORD; do
            if [ -z "${!n}" ]; then echo "::error::Не задан секрет $n (Settings → Secrets and variables → Actions)"; exit 1; fi
          done
          if [ -z "$ADMIN_SECRET" ]; then ADMIN_SECRET=$(printf '%s' "$SUPABASE_ACCESS_TOKEN:admin-album" | sha256sum | cut -d' ' -f1); fi
          supabase secrets set --project-ref zpmzqgxwqoisfvahfhqc "ADMIN_USER=$ADMIN_USER" "ADMIN_PASS=$ADMIN_PASS" "ADMIN_WORD=$ADMIN_WORD" "ADMIN_SECRET=$ADMIN_SECRET"
      - name: Выложить функцию
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-album --no-verify-jwt --project-ref zpmzqgxwqoisfvahfhqc
